# yaml-language-server: $schema=https://devenv.sh/devenv.schema.json
#
# AstroTime dev environment (see devenv.nix).
inputs:
  nixpkgs:
    url: github:cachix/devenv-nixpkgs/rolling
# The Android SDK (devenv.nix, docs/plans/android.md#D69): its licence, and
# its packages, which nixpkgs marks unfree, by name rather than all of unfree.
nixpkgs:
  android_sdk:
    accept_license: true
  permitted_unfree_packages:
    - android-sdk-build-tools
    - android-sdk-cmdline-tools
    - android-sdk-platform-tools
    - android-sdk-platforms
    - build-tools
    - cmdline-tools
    - platform-tools
    - platforms
