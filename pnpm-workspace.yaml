packages:
  - packages/*
  - apps/*

# Install scripts that never run: Electron's downloads its binary, which the
# desktop's CI job fetches itself and the dev shell takes from nixpkgs
# (docs/plans/desktop.md#D79); electron-winstaller's is for Windows.
allowBuilds:
  electron: false
  electron-winstaller: false

catalog:
  "@aparajita/capacitor-secure-storage": 8.0.1
  "@base-ui/react": 1.9.0
  "@capacitor/android": 8.6.0
  "@capacitor/app": 8.1.2
  "@capacitor/browser": 8.0.5
  "@capacitor/cli": 8.6.0
  "@capacitor/core": 8.6.0
  "@capacitor/local-notifications": 8.3.1
  "@playwright/test": 1.61.1
  "@tailwindcss/vite": 4.3.3
  "@types/node": 24.19.2
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@vitejs/plugin-react": 6.1.2
  "@vitest/browser-playwright": 5.0.5
  drizzle-orm: 0.45.4
  # The newest major nixpkgs has, so the dev shell runs the same one (docs/plans/desktop.md#D70).
  electron: 44.10.0
  electron-builder: 26.18.0
  fast-xml-parser: 5.11.2
  i18next: 26.5.12
  "@sqlite.org/sqlite-wasm": 3.54.1-build1
  ical.js: 2.2.1
  knip: 6.41.0
  oxc-transform-react: 0.152.0
  playwright: 1.61.1
  react: 19.3.1
  react-dom: 19.3.1
  react-i18next: 17.1.9
  tailwindcss: 4.3.3
  typescript: 7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.3.0

# Vite+ ships its own Vite core; route every `vite` request to it so the
# toolchain has a single Vite and test-runner instance (as in Jhin).
overrides:
  vite: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
