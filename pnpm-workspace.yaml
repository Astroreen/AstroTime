packages:
  - packages/*
  - apps/*

catalog:
  "@tailwindcss/vite": 4.3.3
  "@types/node": 24.19.2
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@vitejs/plugin-react": 6.1.2
  knip: 6.41.0
  oxc-transform-react: 0.152.0
  react: 19.3.1
  react-dom: 19.3.1
  tailwindcss: 4.3.3
  typescript: 7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.3.0

# Vite+ ships its own Vite core; route every `vite` request to it so the
# toolchain has a single Vite and test-runner instance (as in Jhin).
overrides:
  vite: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
