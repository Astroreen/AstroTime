# docs/plans/foundation.md, D27: proposes the updates of the actions every
# workflow pins to a commit SHA, with the release in the comment; and D41:
# of the Dockerfile's base images, pinned by digest with the tag kept; and
# docs/plans/providers.md, D248: of the interop run's servers, whose bump
# runs the interop run on exactly the change that may break it.
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: ci
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    # A new digest of node:24-alpine, not a new Node: the major goes with
    # the dev shell and CI's, by hand.
    ignore:
      - dependency-name: node
        update-types:
          - version-update:semver-major
    groups:
      images:
        patterns:
          - "*"
    commit-message:
      prefix: build
  - package-ecosystem: docker-compose
    directory: /packages/sync/test/interop
    schedule:
      interval: weekly
      day: monday
    # DAViCal's database: its major goes with DAViCal's own, by hand.
    ignore:
      - dependency-name: postgres
        update-types:
          - version-update:semver-major
    groups:
      interop:
        patterns:
          - "*"
    commit-message:
      prefix: test
