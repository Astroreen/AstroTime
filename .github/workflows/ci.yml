name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Format and lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: vp check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: vp run -r typecheck

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    # Chromium's system packages take 8–10 minutes on a slow apt mirror when
    # the cache misses them (once per runner image; from Jhin).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # Browser-mode tests (*.browser.test.ts) run in headless Chromium.
      - uses: ./.github/actions/chromium
      # The CalDAV integration tests run against a real Radicale, the version
      # devenv.nix provides (packages/sync/test/servers.ts).
      - run: pipx install radicale==3.8.0
      - run: vp test run

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    # Chromium's system packages may come from a slow apt mirror (see unit).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/chromium
      # The accounts' specs sign in to a real Radicale (apps/web/e2e/accounts.spec.ts).
      - run: pipx install radicale==3.8.0
      # Playwright starts the web app's dev server and loads the demo data (apps/web/e2e).
      - run: pnpm --filter @astrotime/web e2e
      - name: Playwright's traces, when a test failed
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-traces
          path: apps/web/test-results/
          retention-days: 7

  knip:
    name: Unused code
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm knip

  build:
    name: Build web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: vp run --filter @astrotime/web build

  desktop-build:
    name: Build desktop (${{ matrix.arch }})
    # The release's packages, built and started as the release builds them,
    # on each architecture's own runner (docs/plans/desktop.md#D79).
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/desktop-packages
        with:
          arch: ${{ matrix.arch }}

  desktop-e2e:
    name: Desktop smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # pnpm never runs Electron's install script (pnpm-workspace.yaml): only
      # this job needs its binary.
      - run: node apps/desktop/node_modules/electron/install.js
      # Chromium's sandbox needs unprivileged user namespaces, which Ubuntu
      # 24.04 keeps from binaries AppArmor has no profile for.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # The smoke test signs in to a real Radicale (apps/desktop/e2e/smoke.spec.ts).
      - run: pipx install radicale==3.8.0
      # A keyring of the tests' own: a session bus and gnome-keyring, which
      # Electron reaches through libsecret (apps/desktop/e2e/credentials.spec.ts).
      # Without it the runner has none: safeStorage's backend is basic_text.
      # And libnotify, which Electron loads for its notifications: without it
      # `Notification.isSupported()` is false and no reminder shows
      # (apps/desktop/e2e/background.spec.ts).
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dbus gnome-keyring libsecret-1-0 libnotify4
      # Playwright builds the app and starts it in Electron, on a virtual display.
      - run: xvfb-run -a -s "-screen 0 1440x900x24" pnpm --filter @astrotime/desktop e2e
      - name: Playwright's traces, when a test failed
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-e2e-traces
          path: apps/desktop/test-results/
          retention-days: 7

  image:
    name: Web image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The release builds the same Dockerfile; this proves it builds and starts.
      - run: docker build -t astrotime:ci .
      - name: The image serves the app, proxies only to its allowlist, and refuses to start without one
        run: |
          # A stand-in server the proxy may reach, on the runner.
          mkdir -p stub && echo calendar > stub/x.ics
          (cd stub && python3 -m http.server 9999 --bind 127.0.0.1 &)
          docker run -d --name web --network host -e ASTROTIME_PROXY_ALLOW=https://cloud.example.com,http://127.0.0.1:9999 astrotime:ci
          # curl's own retries while the server starts, not a sleep loop.
          curl -fsS --retry 30 --retry-delay 1 --retry-all-errors http://127.0.0.1:8080/healthz
          curl -fsS http://127.0.0.1:8080/ | grep -q "<title>AstroTime</title>"
          curl -fsS --retry 10 --retry-delay 1 --retry-all-errors "http://127.0.0.1:8080/dav-proxy/http%3A%2F%2F127.0.0.1%3A9999/x.ics" | grep -q calendar
          status=$(curl -s -o /dev/null -w '%{http_code}' -X PROPFIND "http://127.0.0.1:8080/dav-proxy/https%3A%2F%2Felsewhere.example/dav/")
          test "$status" = 403
          if docker run --rm astrotime:ci 2> refusal.log; then echo "started without ASTROTIME_PROXY_ALLOW" >&2; exit 1; fi
          grep -q "ASTROTIME_PROXY_ALLOW must list" refusal.log
      - name: The image sends assets precompressed and answers a known ETag with 304 (D80)
        run: |
          asset=$(curl -fsS http://127.0.0.1:8080/ | grep -o '/assets/index-[^"]*\.js' | head -n 1)
          curl -fsS -o /dev/null -D br.headers -H 'Accept-Encoding: gzip, br' "http://127.0.0.1:8080${asset}"
          cat br.headers
          grep -qi '^content-encoding: br' br.headers
          grep -qi '^vary: accept-encoding' br.headers
          curl -fsS -o /dev/null -D gzip.headers -H 'Accept-Encoding: gzip' "http://127.0.0.1:8080${asset}"
          grep -qi '^content-encoding: gzip' gzip.headers
          etag=$(tr -d '\r' < br.headers | awk -F': ' 'tolower($1) == "etag" { print $2 }')
          status=$(curl -s -o /dev/null -w '%{http_code}' -H 'Accept-Encoding: gzip, br' -H "If-None-Match: ${etag}" "http://127.0.0.1:8080${asset}")
          test "$status" = 304
          curl -fsS -o /dev/null -D page.headers http://127.0.0.1:8080/week/2026-11-02
          grep -qi '^cache-control: no-cache' page.headers
      - name: The image sends its page under a Content Security Policy, with a fresh nonce each time (D110)
        run: |
          nonce() { tr -d '\r' < "$1" | grep -i '^content-security-policy:' | grep -o "'nonce-[^']*'" | tr -d "'" | cut -c7-; }
          curl -fsS -D first.headers -o first.html http://127.0.0.1:8080/day/2026-11-04
          curl -fsS -D second.headers -o second.html http://127.0.0.1:8080/day/2026-11-04
          cat first.headers
          first=$(nonce first.headers)
          test -n "$first"
          test "$first" != "$(nonce second.headers)"
          grep -qF "nonce=\"${first}\"" first.html
          if grep -q astrotime-csp-nonce first.html; then echo "the placeholder was left in the page" >&2; exit 1; fi
          grep -qi "^content-security-policy: default-src 'none'" first.headers
          grep -qi '^referrer-policy: same-origin' first.headers
      - name: With ASTROTIME_PUBLIC_HOST, the image refuses other hosts but answers its health check (D81)
        run: |
          docker run -d --name listed --network host -e PORT=8081 -e ASTROTIME_PROXY_ALLOW=https://cloud.example.com -e ASTROTIME_PUBLIC_HOST=calendar.example.com astrotime:ci
          curl -fsS --retry 30 --retry-delay 1 --retry-all-errors http://127.0.0.1:8081/healthz
          curl -fsS -H 'Host: calendar.example.com' http://127.0.0.1:8081/ | grep -q "<title>AstroTime</title>"
          status=$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: elsewhere.example' http://127.0.0.1:8081/)
          test "$status" = 421
          curl -fsS -H 'Host: elsewhere.example' http://127.0.0.1:8081/healthz | grep -q ok
          if docker run --rm -e ASTROTIME_PROXY_ALLOW=https://cloud.example.com -e ASTROTIME_PUBLIC_HOST=https://calendar.example.com astrotime:ci 2> refusal.log; then echo "started with a URL in ASTROTIME_PUBLIC_HOST" >&2; exit 1; fi
          grep -q "ASTROTIME_PUBLIC_HOST: " refusal.log
      - name: The server's log, when a check above failed
        if: failure()
        run: |
          docker logs web || true
          docker logs listed || true

  dev-scripts:
    name: Dev scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pipx install radicale==3.8.0
      # shellcheck is preinstalled on GitHub's Ubuntu runners.
      - run: shellcheck -x scripts/t3/*.sh scripts/release-apk.sh .github/actions/desktop-packages/start.sh
      # A ceiling on the whole smoke run, and its log when it fails.
      - run: timeout 180 bash scripts/t3/smoke.sh
      - if: failure()
        run: cat .astrotime-dev/smoke/smoke.log || true

  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # Capacitor 8's Gradle build runs on JDK 21, whatever the runner's
      # default becomes (docs/plans/android.md#D69).
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      # The SDK packages the build needs, so a new runner image cannot take
      # them away; a no-op where the image has them (D69).
      - run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"'
      - run: vp run --filter @astrotime/mobile build
      - run: pnpm --filter @astrotime/mobile sync
      # The debug APK, the release's unsigned one, and the HTTP plugin's
      # tests on MockWebServer.
      - run: ./gradlew assembleDebug assembleRelease test --console=plain
        working-directory: apps/mobile/android
      # As the release names and checks it (.github/workflows/release.yml).
      - name: The release APK is unsigned and carries the product's version
        run: bash scripts/release-apk.sh
      # Signed with this run's own debug key: installable for trying the app,
      # never an update of another run's (D69).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: astrotime-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Gradle's test reports, when a test failed
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-test-reports
          path: apps/mobile/android/app/build/reports/tests/
          retention-days: 7

  # Single required status for branch protection (docs/plans/foundation.md, D30).
  ci:
    name: CI
    if: always()
    needs:
      [
        check,
        typecheck,
        unit,
        e2e,
        knip,
        build,
        desktop-build,
        desktop-e2e,
        image,
        dev-scripts,
        android,
      ]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs passed
        run: |
          results='${{ toJSON(needs.*.result) }}'
          echo "$results"
          if echo "$results" | grep -Eq '"(failure|cancelled|skipped)"'; then exit 1; fi
