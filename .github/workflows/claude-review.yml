name: Claude review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      actions: read
    steps:
      # Until the owner adds the secret, the review is skipped instead of failing.
      - name: Claude's token
        id: token
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: echo "present=${{ env.TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.token.outputs.present == 'true'
        with:
          fetch-depth: 1

      - if: steps.token.outputs.present == 'true'
        uses: anthropics/claude-code-action@d70510b174a1244958df0b03166a54912811f3e6 # v1.0.264
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for the AstroTime project.

            First read AGENTS.md, GLOSSARY.md and docs/plans/foundation.md.
            The PR description names the decisions (D-numbers) it implements.

            Check, in order:
            1. Correctness: bugs, edge cases, error handling, races; time
               zones, recurrence and all-day edge cases.
            2. Spec: the change matches the decisions it claims and the
               "Done when" criteria of its PR in the plan; flag anything
               missing or out of scope.
            3. Architecture rules from AGENTS.md: the core stays isomorphic,
               no iCalendar property is lost on write, the UI goes through
               the local store, WebDAV stays inside the CalDAV provider, no
               UI strings outside i18n.
            4. Tests: real proof of the behaviour; no sleeps or timeouts.
            5. Evidence: the PR description shows concrete proof.

            Use inline comments for specific issues and one top-level summary
            comment. Do not praise; report only what should change, ranked by
            severity. If nothing should change, say so in one line.
            Never @-mention anyone in comments.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
