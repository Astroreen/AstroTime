name: Desktop packages
description: >-
  Build the desktop app's AppImage and deb for this runner's architecture,
  read their fuses back, start the AppImage, install the deb and start it
  (docs/plans/desktop.md#D78, D79). CI runs it on every PR; the release runs
  it before uploading the files.
inputs:
  arch:
    description: x64 or arm64, the runner's own.
    required: true
outputs:
  files:
    description: The AppImage and the deb, one path per line.
    value: ${{ steps.package.outputs.files }}
runs:
  using: composite
  steps:
    - run: vp run --filter @astrotime/desktop build
      shell: bash
    # The packages carry the product's version, the root package.json's
    # (docs/plans/foundation.md#D41); apps/desktop's own is never published.
    - id: package
      env:
        ARCH: ${{ inputs.arch }}
      run: |
        version="$(node -p 'require("./package.json").version')"
        pnpm --filter @astrotime/desktop exec electron-builder --linux "--${ARCH}" --publish never \
          "--config.extraMetadata.version=${version}"
        case "$ARCH" in
          x64) appimage=x86_64 deb=amd64 unpacked=linux-unpacked ;;
          arm64) appimage=arm64 deb=arm64 unpacked=linux-arm64-unpacked ;;
          *) echo "Unknown arch ${ARCH}" >&2; exit 1 ;;
        esac
        release="${PWD}/apps/desktop/release"
        ls -l "$release"
        {
          echo "appimage=${release}/astrotime-${version}-${appimage}.AppImage"
          echo "deb=${release}/astrotime-${version}-${deb}.deb"
          echo "binary=${release}/${unpacked}/astrotime"
          echo "files<<EOF"
          echo "${release}/astrotime-${version}-${appimage}.AppImage"
          echo "${release}/astrotime-${version}-${deb}.deb"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"
      shell: bash
    - name: The fuses read back as electron-builder.yml sets them
      env:
        BINARY: ${{ steps.package.outputs.binary }}
      run: |
        pnpm dlx @electron/fuses@2.1.3 read --app "$BINARY" | tee fuses.txt
        while read -r fuse; do
          grep -qxF "  ${fuse}" fuses.txt || { echo "Expected: ${fuse}" >&2; exit 1; }
        done << 'EOF'
        RunAsNode is Disabled
        EnableCookieEncryption is Enabled
        EnableNodeOptionsEnvironmentVariable is Disabled
        EnableNodeCliInspectArguments is Disabled
        EnableEmbeddedAsarIntegrityValidation is Disabled
        OnlyLoadAppFromAsar is Enabled
        LoadBrowserProcessSpecificV8Snapshot is Disabled
        GrantFileProtocolExtraPrivileges is Disabled
        WasmTrapHandlers is Enabled
        EOF
      shell: bash
    # What the checks below need, and libfuse2, which an AppImage needs and
    # Ubuntu no longer installs by default (README.md#downloads).
    - run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends xvfb xauth xdotool imagemagick fuse3 libfuse2t64
      shell: bash
    # As a user starts it: through FUSE, before the deb brings in anything.
    # AppArmor keeps user namespaces from it, so its AppRun starts it
    # without Chromium's sandbox (D78).
    - name: The AppImage starts and shows its window
      env:
        APPIMAGE: ${{ steps.package.outputs.appimage }}
      run: bash "${GITHUB_ACTION_PATH}/start.sh" "desktop-appimage-${{ inputs.arch }}.png" "$APPIMAGE"
      shell: bash
    # The deb's AppArmor profile lets Chromium's sandbox have its namespaces.
    - name: The deb installs, and the app starts and shows its window
      env:
        DEB: ${{ steps.package.outputs.deb }}
      run: |
        sudo apt-get install -y "$DEB"
        dpkg -s astrotime
        test -f /usr/share/applications/io.github.astroreen.astrotime.desktop
        bash "${GITHUB_ACTION_PATH}/start.sh" "desktop-deb-${{ inputs.arch }}.png" astrotime
      shell: bash
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: desktop-screenshots-${{ inputs.arch }}
        path: desktop-*-${{ inputs.arch }}.png
        if-no-files-found: ignore
        retention-days: 14
